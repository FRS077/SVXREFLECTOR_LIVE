  <g fill="none" stroke-linecap="round" stroke="#5eead4">
    <path pathLength="1000" stroke-width="2.4" stroke-opacity="0.8" stroke-dasharray="80 920" d="M0 213 C 250 213 480 395 740 395 S 1330 218 1600 195"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="8s" begin="-3s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.65" stroke-dasharray="50 950" d="M0 213 C 250 213 480 395 740 395 S 1330 218 1600 195"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="11s" begin="-6s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="30 970" d="M0 213 C 250 213 480 395 740 395 S 1330 218 1600 195"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="14s" begin="-9s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="2.4" stroke-opacity="0.8" stroke-dasharray="80 920" d="M0 232 C 250 232 490 413 750 413 S 1330 235 1600 212"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="9s" begin="-3s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.65" stroke-dasharray="50 950" d="M0 232 C 250 232 490 413 750 413 S 1330 235 1600 212"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="12s" begin="-3s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="30 970" d="M0 232 C 250 232 490 413 750 413 S 1330 235 1600 212"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="15s" begin="-3s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="2.4" stroke-opacity="0.8" stroke-dasharray="80 920" d="M0 248 C 250 248 500 429 760 429 S 1330 250 1600 228"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="8s" begin="-5s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.65" stroke-dasharray="50 950" d="M0 248 C 250 248 500 429 760 429 S 1330 250 1600 228"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="11s" begin="-2s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="30 970" d="M0 248 C 250 248 500 429 760 429 S 1330 250 1600 228"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="14s" begin="-13s" repeatCount="indefinite"/></path>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#glow)" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="5">
    <path pathLength="1000" stroke-dasharray="80 920" d="M0 213 C 250 213 480 395 740 395 S 1330 218 1600 195"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="8s" begin="-0s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-dasharray="80 920" d="M0 232 C 250 232 490 413 750 413 S 1330 235 1600 212"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="11s" begin="-4s" repeatCount="indefinite"/></path>
  </g>
  <g fill="none" stroke-linecap="round" stroke="#a5b4fc">
    <path pathLength="1000" stroke-width="2.4" stroke-opacity="0.8" stroke-dasharray="80 920" d="M0 675 C 300 650 540 510 790 510 S 1260 655 1500 655 S 1580 652 1600 650"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="10s" begin="-3s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.65" stroke-dasharray="50 950" d="M0 675 C 300 650 540 510 790 510 S 1260 655 1500 655 S 1580 652 1600 650"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="13s" begin="-6s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="30 970" d="M0 675 C 300 650 540 510 790 510 S 1260 655 1500 655 S 1580 652 1600 650"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="16s" begin="-9s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="2.4" stroke-opacity="0.8" stroke-dasharray="80 920" d="M0 692 C 300 667 550 526 800 526 S 1260 672 1500 672 S 1580 669 1600 667"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="11s" begin="-1s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.65" stroke-dasharray="50 950" d="M0 692 C 300 667 550 526 800 526 S 1260 672 1500 672 S 1580 669 1600 667"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="14s" begin="-1s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-width="1.8" stroke-opacity="0.5" stroke-dasharray="30 970" d="M0 692 C 300 667 550 526 800 526 S 1260 672 1500 672 S 1580 669 1600 667"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="17s" begin="-1s" repeatCount="indefinite"/></path>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#glow)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="5">
    <path pathLength="1000" stroke-dasharray="80 920" d="M0 675 C 300 650 540 510 790 510 S 1260 655 1500 655 S 1580 652 1600 650"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="10s" begin="-0s" repeatCount="indefinite"/></path>
    <path pathLength="1000" stroke-dasharray="80 920" d="M0 692 C 300 667 550 526 800 526 S 1260 672 1500 672 S 1580 669 1600 667"><animate attributeName="stroke-dashoffset" from="0" to="1000" dur="13s" begin="-4s" repeatCount="indefinite"/></path>
  </g>

  <!-- nœuds -->
  <use href="#node" x="300" y="212"/>
  <use href="#node" x="1300" y="204"/>
  <g>
    <use href="#node" x="816" y="392" transform="translate(816 392) scale(1.4) translate(-816 -392)"/>
  </g>

  <!-- antenne -->
  <g fill="none" stroke="#14b8a6" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round">
    <path d="M991 105 V265"/>
    <path d="M972 130 H1010 M972 153 H1008 M972 177 H1012 M977 200 H1006"/>
    <path d="M1008 114 C 1020 122 1020 140 1008 148"/>
    <path d="M1012 108 C 1028 120 1028 144 1012 154" stroke-opacity="0.18"/>
    <circle cx="991" cy="104" r="3" fill="#14b8a6" fill-opacity="0.5" stroke="none"/>
  </g>

  <!-- talkies-walkies -->
  <use href="#walkie" transform="translate(168 602) rotate(-7)"/>
  <use href="#walkie" transform="translate(1462 413) rotate(-14) scale(0.85)"/>
