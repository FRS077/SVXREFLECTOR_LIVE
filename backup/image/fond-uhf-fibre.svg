<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08101a"/>
      <stop offset="0.55" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#0d0f1d"/>
    </linearGradient>
    <radialGradient id="glowT" cx="300" cy="220" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="1380" cy="620" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c3fa8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4c3fa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#0ea5b7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82a6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e6f7a" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#4338ca" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0.30"/>
    </linearGradient>
    <g id="walkie" fill="none" stroke="#14b8a6" stroke-opacity="0.32" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <rect x="-32" y="-52" width="64" height="106" rx="7"/>
      <rect x="-24" y="-40" width="48" height="24" rx="3" fill="#14b8a6" fill-opacity="0.05"/>
      <path d="M-22 -2 H22 M-22 10 H22 M-22 22 H22 M-22 34 H14"/>
      <rect x="-37" y="-6" width="5" height="26" rx="2"/>
      <rect x="-8" y="-58" width="16" height="6" rx="1.5"/>
      <path d="M-12 -52 L-20 -150"/>
      <circle cx="-20" cy="-152" r="3" fill="#14b8a6" fill-opacity="0.5"/>
    </g>
    <g id="node" fill="none" stroke="#14b8a6">
      <circle r="12" stroke-opacity="0.22"/>
      <circle r="26" stroke-opacity="0.12"/>
      <circle r="4.5" fill="#14b8a6" fill-opacity="0.65" stroke="none"/>
    </g>
    <filter id="glow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowT)"/>
  <rect width="1600" height="900" fill="url(#glowP)"/>

  <!-- grille discrète -->
  <g stroke="#38bdf8" stroke-opacity="0.035" stroke-width="1">
    <path d="M67 0V900M134 0V900M201 0V900M268 0V900M335 0V900M402 0V900M469 0V900M536 0V900M603 0V900M670 0V900M737 0V900M804 0V900M871 0V900M938 0V900M1005 0V900M1072 0V900M1139 0V900M1206 0V900M1273 0V900M1340 0V900M1407 0V900M1474 0V900M1541 0V900"/>
  </g>

  <!-- grands arcs (couverture radio) -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1.2">
    <path d="M410 0 C 470 220 580 380 625 505"/>
    <path d="M1205 55 C 1130 230 1075 360 1075 560 C 1075 700 1100 800 1140 900"/>
    <path d="M625 900 C 620 780 650 740 720 735"/>
  </g>

  <!-- fibre supérieure (turquoise) -->
  <g fill="none" stroke="url(#waveT)" stroke-width="2">
    <path d="M0 213 C 250 213 480 395 740 395 S 1330 218 1600 195"/>
    <path stroke-opacity="0.55" stroke-width="1.4" d="M0 232 C 250 232 490 413 750 413 S 1330 235 1600 212"/>
    <path stroke-opacity="0.35" stroke-width="1.2" d="M0 248 C 250 248 500 429 760 429 S 1330 250 1600 228"/>
  </g>

  <!-- fibre inférieure (violette) -->
  <g fill="none" stroke="url(#waveP)" stroke-width="1.8">
    <path d="M0 675 C 300 650 540 510 790 510 S 1260 655 1500 655 S 1580 652 1600 650"/>
    <path stroke-opacity="0.55" stroke-width="1.2" d="M0 692 C 300 667 550 526 800 526 S 1260 672 1500 672 S 1580 669 1600 667"/>
  </g>


